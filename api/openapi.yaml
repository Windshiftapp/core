        id:
          type: integer
        linked_item_count:
          description: |-
            LinkedItemCount is the number of item↔asset links for this asset
            (0 when the underlying query didn't ask for the rollup).
          type: integer
        set:
          allOf:
          - $ref: '#/components/schemas/dto.AssetSetSummary'
