      type: object
    dto.ItemResponse:
      properties:
        _links:
          allOf:
          - $ref: '#/components/schemas/dto.ItemLinks'
          description: HATEOAS links
        assignee:
          $ref: '#/components/schemas/dto.UserSummary'
        attachments:
          items:
            $ref: '#/components/schemas/dto.AttachmentResponse'
          type: array
        children:
          items:
            $ref: '#/components/schemas/dto.ItemResponse'
          type: array
        comments:
          description: Expanded collections (populated based on ?expand= parameter)
          items:
            $ref: '#/components/schemas/dto.CommentResponse'
          type: array
        completed_at:
          type: string
        created_at:
          description: Timestamps
          type: string
        creator:
          $ref: '#/components/schemas/dto.UserSummary'
        custom_fields:
          additionalProperties: {}
          type: object
        description:
          type: string
        description_html:
          type: string
        due_date:
          type: string
        end_date:
          type: string
        enforced_template:
          allOf:
          - $ref: '#/components/schemas/dto.EnforcedTemplateSummary'
          description: |-
            EnforcedTemplate echoes the mandatory work item template the item's type
            enforces (WI-438), populated only on the create response so non-UI callers
            learn the expected structure even when they supplied their own
            description. Omitted when the type enforces no mandatory template.
        history:
          items:
            $ref: '#/components/schemas/dto.HistoryResponse'
          type: array
        id:
          type: integer
        is_task:
          type: boolean
        item_type:
          $ref: '#/components/schemas/dto.ItemTypeSummary'
        iteration:
          $ref: '#/components/schemas/dto.IterationSummary'
        key:
          description: e.g., "PROJ-123"
          type: string
        milestones:
          items:
            $ref: '#/components/schemas/dto.MilestoneSummary'
          type: array
        parent_id:
          description: |-
            Hierarchy. ParentID is the raw DB id. ParentKey is the parent's
            ready-to-display key (e.g. "WI-120"), computed server-side from the
            parent's own workspace — clients must render this rather than building a
            key from ParentID, which is a DB id in a different namespace and may even
            point into another workspace. ParentKey and ParentTitle are populated
            only on permission-checked single-item reads, and only when the caller
            may view the parent (see ItemHandler.setParentSummary); they are omitted
            from list responses and withheld across a workspace boundary the caller
            cannot see.
          type: integer
        parent_key:
          type: string
        parent_title:
          type: string
        priority:
          $ref: '#/components/schemas/dto.PrioritySummary'
        project:
          $ref: '#/components/schemas/dto.ProjectSummary'
        start_date:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/dto.StatusSummary'
          description: Related entities (populated based on ?expand= parameter)
        title:
          type: string
        transitions:
          items:
            $ref: '#/components/schemas/dto.TransitionResponse'
          type: array
        updated_at:
          type: string
        workspace:
          $ref: '#/components/schemas/dto.WorkspaceSummary'
        workspace_id:
          type: integer
        workspace_item_number:
          type: integer
        workspace_key:
          type: string
      type: object
