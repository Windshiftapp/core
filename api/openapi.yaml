  contact: {}
  description: 'Public API reference for Windshift. REST operations use the `/rest/api/v1`
    base path and bearer tokens (`Authorization: Bearer crw_*`). Operational health
    and metrics endpoints are unauthenticated and use root-level paths.'
  title: Windshift HTTP API
  version: "1"
openapi: 3.0.3
paths:
  /admin/api-tokens:
    get:
      description: System-admin only. Optionally filter to a single user via `user_id`.
      parameters:
      - description: Filter to tokens owned by this user
        in: query
        name: user_id
        schema:
          type: integer
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Items per page (max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/handlers.PaginatedResponse'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/models.APIToken'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid user_id
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:api-tokens:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all API tokens (admin)
      tags:
      - admin
  /admin/api-tokens/{id}:
    delete:
      description: System-admin only.
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Token revoked
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid token ID
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:api-tokens:write
            scope
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Token not found
      security:
      - BearerAuth: []
      summary: Revoke an API token (admin)
      tags:
      - admin
  /admin/audit-logs:
    get:
      description: System-admin only. Filter by action type, resource type, user,
        and timestamp range.
      parameters:
      - description: Exact-match filter on action type
        in: query
        name: action_type
        schema:
          type: string
      - description: Exact-match filter on resource type
        in: query
        name: resource_type
        schema:
          type: string
      - description: Filter to actions performed by this user
        in: query
        name: user_id
        schema:
          type: integer
      - description: Start of timestamp range (RFC3339)
        in: query
        name: from
        schema:
          type: string
      - description: End of timestamp range (RFC3339)
        in: query
        name: to
        schema:
          type: string
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Items per page (max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/handlers.PaginatedResponse'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/handlers.AuditLogEntryResponse'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid filter parameter
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:audit-logs:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List audit log entries (admin)
      tags:
      - admin
  /admin/audit-logs/since:
    get:
      description: 'System-admin only. Returns audit log rows with id > after_id in
        ascending id order, capped at limit. Designed for external streaming consumers
        (e.g. SIEM exporters): persist next_after_id between calls and pass it back
        as after_id; rows are never re-delivered. Use after_id=0 to start from the
        beginning.'
      parameters:
      - description: Strict-greater-than cursor (default 0 = from beginning)
        in: query
        name: after_id
        schema:
          type: integer
      - description: Max rows to return (default 500, capped at 1000)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/windshift_internal_restapi_v1_handlers.AuditLogStreamResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid after_id or limit
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:audit-logs:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Tail audit log entries via cursor (admin)
      tags:
      - admin
  /admin/groups:
    get:
      description: System-admin only.
      parameters:
      - description: Page number (1-based)
