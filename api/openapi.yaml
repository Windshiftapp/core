  /asset-sets/{setId}/assets:
    get:
      description: Paginated list of assets in the set, filtered by optional type/category/status/search
        query params. Returns 404 if the set is missing or the caller can't view it.
      parameters:
      - description: Asset set ID
        in: path
        name: setId
        required: true
        schema:
          type: integer
      - description: Filter by asset type ID
        in: query
        name: type_id
        schema:
          type: integer
      - description: Filter by asset category ID
        in: query
        name: category_id
        schema:
          type: integer
      - description: Filter by asset status ID
        in: query
        name: status_id
        schema:
          type: integer
      - description: Free-text title search
        in: query
        name: q
