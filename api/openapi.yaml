        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create a group (admin)
      tags:
      - admin
  /admin/groups/{id}:
