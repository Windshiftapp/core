          type: object
        description:
          type: string
        description_html:
          type: string
        due_date:
          description: Due date for item completion
          type: string
        effective_project_id:
          description: |-
            EffectiveProjectID is the resolved project after walking InheritProject
            up the parent chain. Consumers that need "which time-tracking project
            applies to this item" should read this, not ProjectID directly.
          type: integer
        effective_project_name:
          type: string
        end_date:
          description: End date for item
          type: string
        estimate_minutes:
          description: Time estimate in minutes (compared against logged worklog time)
          type: integer
        frac_index:
          description: Manual sorting field
          type: string
        id:
          type: integer
        inherit_project:
          description: If true, ProjectID is ignored and the parent item's effective
            project is used
          type: boolean
        is_task:
          description: Flag to mark this item as a task (checklist item)
          type: boolean
        item_type_builtin_key:
          type: string
        item_type_id:
          description: Optional, defaults to workspace's default item type
          type: integer
        item_type_name:
          type: string
        iteration_end_date:
          type: string
        iteration_id:
          description: Optional iteration assignment
          type: integer
        iteration_name:
          type: string
        labels:
          description: Global item labels
          items:
            $ref: '#/components/schemas/models.Label'
          type: array
        last_active_at:
          description: |-
            Recency for the board "Bubble Mode" sort. Bumped on activity (comments,
            edits, transitions) but not on manual frac_index reorder.
          type: string
        milestones:
          items:
            $ref: '#/components/schemas/models.Milestone'
          type: array
        parent_id:
          description: Hierarchy fields
          type: integer
        parent_title:
          type: string
        parent_workspace_item_number:
          description: Parent's workspace-scoped number, for rendering the parent
            key
          type: integer
        personal_labels:
          items:
            $ref: '#/components/schemas/models.PersonalLabel'
          type: array
        priority_builtin_key:
          type: string
        priority_color:
          type: string
        priority_icon:
          type: string
        priority_id:
          description: Foreign key to priorities table
          type: integer
        priority_name:
          type: string
        project_id:
          description: |-
            Time-tracking project membership. "Project" in Windshift always refers
            to a row in time_projects; both ProjectID and TimeProjectID below are
            FKs to that table, serving different roles:
              ProjectID       - the project this item belongs to (the bucket
                                worklogs default to). Can be inherited from the
                                parent item; see InheritProject.
              TimeProjectID   - overrides the project used when logging time on
                                this specific item (independent of the bucket the
                                item belongs to).
            EffectiveProjectID (below) is the resolved value after applying
            inheritance, and is what consumers should read.
          type: integer
        project_inheritance_mode:
          description: '"none" | "inherit" | "direct"'
          type: string
        project_name:
          description: Name of the time-tracking project this item belongs to (joined
            from time_projects via ProjectID)
          type: string
        related_work_item_id:
          description: Personal task relationship (for linking personal workspace
            tasks to work items)
          type: integer
        related_work_item_number:
          type: integer
        related_work_item_title:
          description: Related work item joined fields (for personal tasks)
          type: string
        related_work_item_workspace_id:
          type: integer
        related_work_item_workspace_key:
          type: string
        reporter_avatar:
          description: Avatar URL of reporter
          type: string
        reporter_email:
          description: Email of reporter
          type: string
        reporter_id:
          description: User who reported this item (from Jira import)
          type: integer
        reporter_name:
          description: Full name of reporter
          type: string
        request_type_id:
          description: Request type used for submission
          type: integer
        request_type_name:
          description: Name of the request type
          type: string
        start_date:
          description: Start date for item
          type: string
        status_builtin_key:
          description: Stable key for translating built-in statuses
          type: string
        status_color:
          description: Color from the status category (joined field)
          type: string
        status_id:
          description: Foreign key to statuses table
          type: integer
        status_name:
          description: Name from statuses table (joined field)
          type: string
        status_since:
          description: |-
            StatusSince is when the item last entered its current status, derived from
            item_history (falls back to created_at when there is no recorded change).
          type: string
        story_points:
          description: Estimation
          type: number
        time_project_id:
          type: integer
        time_project_name:
          description: Name of the time-tracking project overriding worklog defaults
            (joined from time_projects via TimeProjectID)
          type: string
        title:
          type: string
        updated_at:
          type: string
        virtual_field_data:
          additionalProperties: {}
          type: object
        workspace_id:
          type: integer
        workspace_item_number:
          description: Workspace-specific sequential number for display keys
          type: integer
        workspace_key:
          type: string
        workspace_name:
          description: Joined fields for API responses
          type: string
