#
# TRMNL private plugin definition. `trmnlp pull` overwrites this file, so keep
# edits in sync with the hosted plugin if you ever push it.
#
---
strategy: polling
name: Windshift Daily Summary
description: Today at a glance in Windshift
refresh_interval: 30
polling_verb: get
framework_version: latest
no_screen_padding: 'no'
dark_mode: 'no'

# Four requests per refresh, exposed as IDX_0..IDX_3:
#   IDX_0 -> the token owner
#   IDX_1 -> the open items the summary is computed from
#   IDX_2 -> count of items the owner closed today (pagination.total_items only)
#   IDX_3 -> everything that moved today, across every workspace the token sees
#
# The date-dependent queries are pre-URL-encoded so that only the date itself
# is interpolated; that keeps the encoding correct without relying on the
# renderer to escape a whole query string built with Liquid tags.
#
# The `append` then `replace` pair tolerates a trailing slash on the entered
# URL: it only collapses a doubled slash immediately before /rest/, so the
# one in https:// is never touched. (`remove_last: '/'` is NOT a safe
# substitute — with no trailing slash it eats the slash in the scheme.)
polling_url: |-
  {{ windshift_url | strip | append: '/rest/api/v2/users/me' | replace: '//rest/', '/rest/' }}
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql={{ scope_query | strip | url_encode }}&page_size=100&sort=-updated_at
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=assignee%20%3D%20currentUser()%20AND%20status%20%3D%20Done%20AND%20updated%20%3E%3D%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=1
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=updated%20%3E%3D%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=6&sort=-updated_at

polling_headers: Authorization=Bearer {{ api_token | strip }}&Accept=application/json

custom_fields:
  - keyname: windshift_url
    field_type: url
    name: Windshift Server URL
    placeholder: https://windshift.example.com
    description: Base URL of your Windshift server
    help_text: Just the origin — no /rest/api/v2 suffix. A trailing slash is fine.
    required: true

  - keyname: api_token
    field_type: password
    name: API Token
    placeholder: crw_...
    description: A personal Windshift API token
    help_text: Create one under Profile > API Tokens. It needs the items:read and users:read scopes.
    required: true

  - keyname: scope_query
    field_type: string
    name: Scope
    default: assignee = currentUser() AND status != Done
    description: The backlog the stats describe
    help_text: Windshift QL. The due, overdue and priority counts are all derived from this set.
    required: true
