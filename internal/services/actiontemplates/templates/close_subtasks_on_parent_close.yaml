key: close_subtasks_on_parent_close
name: Close subtasks when parent closes
description: |
  When an item reaches a terminal status, recursively transition its
  subtasks to the matching terminal status in their own workflows. Works
  across workspaces when the actor can edit; descendants the actor cannot
  edit are skipped and logged.
category: Item lifecycle
trigger_type: status_transition
trigger_config:
  to_status_category_completed: true
nodes:
  - id: trigger
    node_type: trigger
    node_config: {}
    position:
      x: 0
      y: 0
  - id: descendants
    node_type: related_items
    node_config:
      relation: descendants
      cross_workspace: true
    position:
      x: 240
      y: 0
  - id: close
    node_type: transition_item
    node_config:
      target:
        mode: matching_terminal
      skip_if_already_matching: true
    position:
      x: 480
      y: 0
edges:
  - source_node_id: trigger
    target_node_id: descendants
    edge_type: default
  - source_node_id: descendants
    target_node_id: close
    edge_type: default
