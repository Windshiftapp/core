key: milestone_on_release_tag
name: Promote milestone + attach issues when matching tag appears
description: |
  When a tag matching the repository's milestone_tag_pattern (default v*)
  appears, upsert the milestone keyed by {{ref.short}}. A milestone from a
  release/* branch is promoted to "in-progress" and a milestone_releases
  row is written; otherwise one is created at that status.

  If the tag has a predecessor (ref.prev_name), the executor walks commits
  in (prev_tag, this_tag] and auto-attaches items referenced in their
  messages (e.g. "WS-42") — the "what shipped in this release" view.

  Pair with "Create planning milestone from release branch" if you branch
  before tagging; the upsert key pairs them.
category: SCM automation
trigger_type: scm_tag_created
trigger_config: {}
nodes:
  - id: trigger
    node_type: trigger
    node_config: {}
    position:
      x: 0
      y: 0
  - id: create
    node_type: create_milestone
    node_config:
      name_template: "Release {{ref.short}}"
      upsert_key_template: "{{ref.short}}"
      status_on_branch: planning
      status_on_tag: in-progress
      attach_release_on_tag: true
      attach_commit_issues: true
    position:
      x: 280
      y: 0
edges:
  - source_node_id: trigger
    target_node_id: create
    edge_type: default
