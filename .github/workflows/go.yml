name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run layering guard
        # Blocks new architectural import violations (see scripts/check-layering.sh).
        # Existing violations are recorded in scripts/.layering-baseline.
        run: bash scripts/check-layering.sh

  deadcode:
    name: Deadcode Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Run deadcode analysis
        id: deadcode
        run: |
          set +e
          OUTPUT=$(deadcode -test ./... 2>&1)
          EXIT_CODE=$?
          set -e

          if [ -n "$OUTPUT" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            # Escape for GitHub Actions
            OUTPUT="${OUTPUT//'%'/'%25'}"
            OUTPUT="${OUTPUT//$'\n'/'%0A'}"
            OUTPUT="${OUTPUT//$'\r'/'%0D'}"
            echo "output=$OUTPUT" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR with deadcode findings
        if: steps.deadcode.outputs.found == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const output = `${{ steps.deadcode.outputs.output }}`.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%');
            const body = `## 🔍 Deadcode Analysis

            <details>
            <summary>Found potentially unused code (click to expand)</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            > These functions may be unused. Consider removing them if they're no longer needed.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  openapi:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify api/openapi.{yaml,json} matches handler annotations
        run: make openapi-check
        # Fails when generated spec diverges from committed spec. The live
        # contract test (`TestAPIOpenAPIContract` in core-tests) verifies
        # actual response shapes against the spec; that test runs from the
        # core-tests repo via overlay.sh, not from this workflow.

      - name: Upload regenerated spec on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-regenerated-spec
          path: |
            api/openapi.json
            api/openapi.yaml
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build
        run: |
          go build -ldflags="-s -w" -o windshift .
