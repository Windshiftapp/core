apiVersion: apps/v1
kind: Deployment
metadata:
  name: windshift
  namespace: windshift
  labels:
    app.kubernetes.io/name: windshift
spec:
  # Windshift is a single-replica application. Do not raise this without
  # reading "Why one replica" in deploy/kubernetes.md.
  replicas: 1
  # Recreate keeps two pods from holding the ReadWriteOnce volume at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: windshift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windshift
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # The scratch image writes /data as uid/gid 65534; fsGroup makes the
        # volume writable for that user.
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: windshift
          image: ghcr.io/windshiftapp/windshift:0.9.2 # pin the release you deploy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Public URL. Must match how users reach Windshift (scheme + host).
            - name: BASE_URL
              value: "https://windshift.example.com"
            # Required behind an Ingress or reverse proxy.
            - name: USE_PROXY
              value: "true"
            - name: SSO_SECRET
              valueFrom:
                secretKeyRef:
                  name: windshift-secrets
                  key: SSO_SECRET
            # SQLite (default). See the commented PostgreSQL block below.
            - name: DB_TYPE
              value: sqlite
            - name: DB_PATH
              value: /data/windshift.db
            - name: ATTACHMENT_PATH
              value: /data/attachments
            - name: PLUGIN_DIR
              value: /data/plugins
            - name: AI_PROMPTS_DIR
              value: /data/prompts
            # SQLite and some parsers need a writable /tmp; the root filesystem
            # is read-only, so it is an emptyDir.
            - name: TMPDIR
              value: /tmp
            - name: SQLITE_TMPDIR
              value: /tmp
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            # Optional: total process memory budget in MB. Keep at or below the
            # container memory limit.
            # - name: WINDSHIFT_MEMORY_LIMIT_MB
            #   value: "2048"
            # Optional: bearer token protecting /metrics.
            # - name: WINDSHIFT_METRICS_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: windshift-secrets
            #       key: WINDSHIFT_METRICS_TOKEN
            #
            # --- PostgreSQL: replace DB_TYPE/DB_PATH above with these ---
            # - name: DB_TYPE
            #   value: postgres
            # - name: POSTGRES_HOST
            #   value: windshift-db.example.com
            # - name: POSTGRES_PORT
            #   value: "5432"
            # - name: POSTGRES_USER
            #   value: windshift
            # - name: POSTGRES_DB
            #   value: windshift
            # - name: POSTGRES_SSLMODE
            #   value: require
            # - name: POSTGRES_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: windshift-secrets
            #       key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: windshift-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
